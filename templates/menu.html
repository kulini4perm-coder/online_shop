<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-md-auto font-weight-normal">Online Shop</h5>
    <nav class="ms-md-auto d-flex align-items-center gap-2">
        <a class="p-2 text-dark text-decoration-none" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 text-dark text-decoration-none" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 text-dark text-decoration-none" href="{% url 'blog:home' %}">Блог</a>

        <span class="text-muted mx-2">|</span>

        {% if user.is_authenticated %}
            <span class="text-muted me-3">Привет, <strong>{{ user.first_name|default:user.email }}</strong>!</span>
            <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary btn-sm me-2">Профиль</a>
            <form action="{% url 'users:logout' %}" method="post" class="m-0 d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
            </form>
        {% else %}
            <a class="btn btn-outline-primary btn-sm" href="{% url 'users:login' %}">Войти</a>
            <a class="btn btn-success btn-sm" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
